name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job may write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  rust:
    name: Rust tray app (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      # Actions pinned to a commit SHA; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy (pedantic, warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      # The cross-process test starts the real engine from bin\
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build the engine for the cross-process test
        run: dotnet build engine/NazarCapture.Engine.csproj -c Release -o bin
      # --include-ignored also runs the end-to-end test of the real settings window and the
      # cross-process test against the engine (both under test-only names, temp settings)
      - name: cargo test (incl. the settings-window and cross-process tests)
        run: cargo test --locked -- --include-ignored
      - name: Self-test of the release build
        shell: pwsh
        run: |
          cargo build --release --locked
          "{0:N0} bytes" -f (Get-Item target/release/NazarCapture.exe).Length
          $p = Start-Process target/release/NazarCapture.exe --self-test -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

  dotnet:
    name: C# capture engine (build, format, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      # The recording tests drive a real ffmpeg (trim, GIF, audio sync)
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Restore (locked)
        run: dotnet restore NazarCapture.sln --locked-mode
      - name: Build (warnings are errors)
        run: dotnet build NazarCapture.sln -c Release --no-restore
      - name: Format
        run: dotnet format NazarCapture.sln --verify-no-changes --no-restore
      # Pixel tests compare UI renders with references; they skip themselves (naming the font) when a
      # reference font such as Segoe UI Variable is missing on the runner image, and use a
      # blur-tolerant comparison here because font versions differ between Windows builds.
      - name: Test
        env:
          NAZAR_PIXEL_TOLERANCE: lenient
        run: dotnet test NazarCapture.sln -c Release --no-build --logger "console;verbosity=normal"

  package:
    name: Package
    runs-on: windows-latest
    needs: [rust, dotnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version" }
      # A pinned Inno Setup, checked by its SHA-256, in a folder of its own: whatever the runner image or Chocolatey
      # bring (another 6.x, or 7.x in "Inno Setup 7") never builds a release. packaging\nazar.iss switches
      # RedirectionGuard off depending on the compiler, and smoke_test.ps1 measures it with exactly this version.
      # build.ps1 -InnoVersion makes the compiler itself confirm the version (#error in nazar.iss otherwise).
      - name: Inno Setup (pinned)
        shell: pwsh
        run: |
          $version = "6.7.4"
          $sha256 = "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
          $tag = "is-" + $version.Replace(".", "_")
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$version.exe" -OutFile $setup
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($hash -ne $sha256) { throw "innosetup-$version.exe has SHA-256 $hash, expected $sha256" }
          $dir = Join-Path $env:RUNNER_TEMP "inno-$version"
          $install = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/NOICONS", "/DIR=$dir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installing Inno Setup $version failed with exit code $($install.ExitCode)" }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found in $dir" }
          "INNO_COMPILER=$iscc" >> $env:GITHUB_ENV
          "INNO_VERSION=$version" >> $env:GITHUB_ENV
          "Inno Setup ${version}: $iscc"
      # The in-app update (1.1.6 on) downloads the setup and checks its .sha256; the ZIP and its .sha256 stay
      # release assets for the in-app update of 1.1.3 to 1.1.5
      - name: Build, zip and installer
        shell: pwsh
        run: ./build.ps1 -Package -Installer -InnoCompiler $env:INNO_COMPILER -InnoVersion $env:INNO_VERSION
      - name: Check the checksum files
        shell: pwsh
        run: |
          foreach ($file in Get-Item dist/*.zip, dist/Nazar-Capture-Setup-*.exe) {
            $expected = "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant(), $file.Name
            $written = (Get-Content "$($file.FullName).sha256" -Raw).Trim()
            if ($written -ne $expected) { throw "$($file.Name).sha256 is '$written', expected '$expected'" }
            "ok   $($file.Name).sha256"
          }
      - name: Smoke test (silent install, self-test, reinstall without autostart, silent update with restart, silent uninstall)
        shell: pwsh
        run: ./packaging/smoke_test.ps1 -Setup (Get-Item dist/Nazar-Capture-Setup-*.exe).FullName
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nazar-capture-win-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/Nazar-Capture-Setup-*.exe
            dist/Nazar-Capture-Setup-*.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installer-smoke-logs
          path: build/smoke/
          if-no-files-found: ignore

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nazar-capture-win-x64
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            Nazar-Capture-Setup-*.exe
            Nazar-Capture-Setup-*.exe.sha256
            *.zip
            *.zip.sha256
